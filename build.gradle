apply plugin: 'idea'

idea {
    module {
        inheritOutputDirs = true
    }
}
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.40'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.


group = "hunternif.mc.atlas"
archivesBaseName = "antiqueatlas"

ext.mod_version = "$version_major.$version_minor.$version_patch"
version = "$mc_version-$mod_version"

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// In a dev run FML resolves a mod's assets from the directory it found the @Mod class in,
// so resources have to land beside the classes rather than in their own output dir -- with
// them split, every model and texture of this mod is missing in runClient.
sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    accessTransformer = files(
            'src/main/resources/META-INF/atlas_at.cfg',
            'libs_at/tfc_at.cfg',
            'libs_at/ImmersiveEngineering_at.cfg'
    )

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property "fml.coreMods.load", "gloomyfolken.hooklib.minecraft.MainHookLoader"
            property 'mixin.env.disableRefMap', 'true'

            property '--usename', 'hohserg'

            mods {
                antiqueatlas {
                    source sourceSets.main
                }
            }
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    flatDir {
        dirs 'dev_mods'
    }
    // For Obfuscate, which TFC needs at runtime in a dev run.
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    minecraft ("net.minecraftforge:forge:$mc_version-$forge_version"){

    }

    implementation fg.deobf("abc:crafttweaker2:4.1.20.660")

    implementation fg.deobf("abc:hooklib:3.17")
    implementation fg.deobf("abc:Endothermic:2.1.4")
    implementation fg.deobf("io.gitlab.hohserg.elegant.networking:elegant-networking-1.12:3.15")
    compileOnly fg.deobf("abc:TFC:1.12.2-3")
    // Kept out of the published jar, but a dev run needs TFC actually present: the TFC
    // world type and its chunk data are what the map reads, and Segment references TFC too.
    runtimeOnly fg.deobf("abc:TFC:1.12.2-3")
    // TFC subscribes to Obfuscate's events, so FML fails to construct TFC without it.
    runtimeOnly fg.deobf("curse.maven:obfuscate-289380:2916310")
    // TFC registers past vanilla's 4096 block id ceiling and needs the id range extended.
    runtimeOnly fg.deobf("abc:RoughlyEnoughIDs:2.2.1")
    // RoughlyEnoughIDs is mixin-based and refuses to load without this. Already deobfuscated.
    runtimeOnly "abc:mixinbooter:9.1-deobf"
    // TFC's leaf rendering reaches into Dynamic Trees, so without it the game crashes
    // tesselating leaves. Built from the DynamicTreesTFC repo.
    runtimeOnly fg.deobf("abc:treestfc:1.0")

    compileOnly fg.deobf("abc:ImmersiveEngineering:0.12.107")
    compileOnly fg.deobf("abc:immersivepetroleum-1.12.2:1.1.10")
    //implementation fg.deobf("abc:OptiFine:1.12.2_HD_U_G5")
    //implementation "abc:OptiFine:1.12.2_HD_U_G5_dev"
    /*implementation ("net.minecraft:launchwrapper:"){
        version {
            strictly 'of-2.2'
        }
    }*/

    implementation fg.deobf("dev_mods:ResourceReloader:1.0.2.5")

    //testImplementation "junit:junit:4.+"
}

